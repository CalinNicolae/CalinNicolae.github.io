<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog">
  <meta property="og:title" content="Blog">
  <meta property="og:description" content="Blog">
  <meta property="og:type" content="website">
  <title>Blog Calin Mihai Nicolae</title>
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <link rel="apple-touch-icon" href="./assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="./assets/js/layout.js"></script>
  <script type="module" src="./assets/js/transitions.js"></script>
  <script type="module" src="./assets/js/blog.js"></script>
</head>
<body>

<div id="page-transition">
  <p class="transition-text">&gt; LOADING...</p>
</div>

<a href="#main" class="skip-link">Skip to main content</a>

<nav></nav>

<div class="blog-page-wrap" id="main">
  <header class="blog-page-header">
    <p class="blog-page-label">&gt; ls ./blog --all</p>
    <h1 class="blog-page-title">// BLOG</h1>
    <div class="blog-page-underline"></div>
    <p class="blog-page-subtitle">All posts, reflections &amp; writeups.</p>
  </header>

  <div class="filter-bar-wrap">
    <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter posts by category">
    </div>
  </div>

  <main class="post-list-wrap" id="post-list" aria-live="polite">
  </main>

  <div id="empty-state" class="empty-state" style="display:none;" aria-live="polite">
    <p class="empty-error">&gt; ERROR: No posts found matching filter.</p>
    <p class="empty-hint">Try: [ALL]</p>
  </div>
</div>

<footer class="site-footer"></footer>
</body>
</html>
