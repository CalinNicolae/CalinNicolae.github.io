<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog Posts">
  <meta property="og:title" content="Blog Posts">
  <meta property="og:description" content="Post">
  <meta property="og:type" content="article">
  <title>Blog Posts</title>
  <link rel="icon" type="image/png" href="./assets/images/favicon.png">
  <link rel="apple-touch-icon" href="./assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="./assets/js/layout.js"></script>
  <script type="module" src="./assets/js/transitions.js"></script>
  <script type="module" src="./assets/js/post.js"></script>
</head>
<body>

<div id="scroll-bar"></div>

<a href="#main" class="skip-link">Skip to main content</a>

<div id="page-transition">
  <p class="transition-text">&gt; LOADING...</p>
</div>

<nav></nav>

<div class="post-page-wrap" id="main">

  <header class="post-header" id="post-header" style="display:none;">
    <a href="./blog.html" class="post-back">> cd ../blog</a>
    <div class="post-header-badges">
      <span class="tag" id="post-category"></span>
      <span class="required-badge" id="required-badge" style="display:none;">[ REQUIRED ]</span>
    </div>
    <h1 class="post-title" id="post-title"></h1>
    <p class="post-meta" id="post-meta"></p>
  </header>

  <div class="post-cover" id="post-cover" style="display:none;">
    <img class="post-cover-img" id="cover-img" src="" alt="">
    <p class="post-cover-caption" id="cover-caption"></p>
  </div>

  <div class="post-speaker-card" id="speaker-card" style="display:none;">
    <p class="speaker-label">&gt; Speaker Info</p>
    <p class="speaker-name" id="speaker-name"></p>
    <p class="speaker-bio"  id="speaker-bio"></p>
  </div>

  <article class="post-body" id="post-body">
    <p style="color:var(--text-dim);font-family:var(--font-mono);">Loading&hellip;</p>
  </article>

  <section class="post-gallery-section" id="gallery-section" style="display:none;">
    <p class="gallery-label">&gt; ls gallery</p>
    <div class="post-gallery-grid" id="gallery-grid"></div>
  </section>

  <section class="related-section" id="related-section" style="display:none;">
    <p class="related-label" id="related-label"></p>
    <div class="related-grid" id="related-grid"></div>
  </section>

</div>
<div class="post-404" id="post-404" style="display:none;">
  <p class="post-404-line" id="err-line-1"></p>
  <p class="post-404-line" id="err-line-2"></p>
  <p class="post-404-line">&gt; Suggested fix: check your URL or return to /blog</p>
  <br>
  <a href="./blog.html" class="hero-btn hero-btn-cyan" style="margin-top:1rem;">&gt;&gt; cd ../blog</a>
</div>

<footer class="site-footer"></footer>
</body>
</html>
